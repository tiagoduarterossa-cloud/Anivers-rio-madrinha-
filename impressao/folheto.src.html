<title>Folheto Carolina 38 para imprimir</title>

<style>
@page{size:210mm 297mm;margin:0}
*{box-sizing:border-box}html,body{margin:0}

<div class="how">
  <span><b>Folheto em papel</b></span>
  <span><b>1.</b> Imprimir em papel normal A4, tamanho real.</span>
  <span><b>2.</b> Recortar a tira pelo contorno.</span>
  <span><b>3.</b> Dobrar em harmónio pelas linhas cinzentas, para a frente e para trás, como os folhetos verdadeiros.</span>
  <span><b>4.</b> Meter dentro da caixa, ao lado dos comprimidos.</span>
</div>
<div class="strip"><div class="doc">{{DOC}}</div></div>
