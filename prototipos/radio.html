<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rádio Madrinha 38 FM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:wght@400;600;800&family=VT323&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
/* Layout: um rádio de baquelite ao centro; o mostrador desliza com o dedo */
:root{color-scheme:light;--bg:#2e4a46;--body:#c8532f;--body2:#9e3c1f;--cream:#f3e4c4;--ink:#2a1a12;--glow:#ffd27a;--disp:"Bungee",system-ui,sans-serif;--txt:"Karla",system-ui,sans-serif;--lcd:"VT323",monospace}
body{margin:0;min-height:100vh;background:var(--bg);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 40px);color:var(--cream);font:16px/1.5 var(--txt);padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
h1{font:400 clamp(26px,8vw,36px)/1 var(--disp);margin:0;text-align:center;color:var(--cream)}
.sub{margin:-8px 0 0;text-align:center;color:#cfe0d9;font-size:15px}
.radio{width:100%;max-width:400px;background:linear-gradient(var(--body),var(--body2));border-radius:28px 28px 18px 18px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;gap:14px}
.grill{height:120px;border-radius:14px;background:radial-gradient(circle,#3a2418 1.6px,transparent 2px) 0 0/9px 9px,#5a3422;box-shadow:inset 0 3px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.grill b{font:400 22px var(--disp);color:var(--cream);opacity:.85;letter-spacing:.06em}
.dial{position:relative;height:74px;border-radius:10px;background:var(--cream);overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.35);touch-action:none;cursor:ew-resize}
.dial.on{background:linear-gradient(#fff3d1,var(--cream));box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 24px var(--glow)}
.scale{position:absolute;left:0;top:0;height:100%;display:flex;align-items:flex-end;padding-bottom:6px;will-change:transform}
.scale span{width:40px;flex:none;text-align:center;font:600 12px var(--txt);color:var(--ink);border-left:1px solid rgba(42,26,18,.4);height:30px;line-height:44px}
.scale span.st{color:#b3261e;font-weight:800}
.needle{position:absolute;left:50%;top:6px;bottom:6px;width:3px;margin-left:-1.5px;background:#b3261e;border-radius:2px;box-shadow:0 0 6px rgba(179,38,30,.6)}
.lcd{background:#1f2a1c;color:#9ff08a;font:400 26px/1 var(--lcd);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);min-height:48px;align-items:center}
.lcd small{font-size:18px;color:#6fbf5e;text-align:right}
.knobs{display:flex;justify-content:space-between;align-items:center}
.knob{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7ead0,#b79c6c);box-shadow:0 4px 8px rgba(0,0,0,.35);border:0;cursor:pointer;font:800 10px var(--txt);color:var(--ink)}
.found{display:flex;gap:6px}
.found i{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.3)}
.found i.on{background:var(--glow);box-shadow:0 0 8px var(--glow)}
.msg{width:100%;max-width:400px;background:rgba(0,0,0,.25);border-radius:14px;padding:14px 16px;min-height:90px}
.msg b{display:block;font:400 13px var(--disp);color:var(--glow);letter-spacing:.04em}
.msg p{margin:4px 0 0;font-size:17px}
.code{width:100%;max-width:400px;display:flex;gap:8px}
.code input{flex:1;min-width:0;font:400 24px var(--lcd);background:var(--cream);color:var(--ink);border:0;border-radius:10px;padding:10px 12px;letter-spacing:.2em}
.code button,.start{font:800 15px var(--txt);background:var(--glow);color:var(--ink);border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
.start{border-radius:999px;padding:14px 24px}
</style></head><body>
<h1>Rádio Madrinha<br>38 FM</h1>
<p class="sub">Roda o mostrador com o dedo e procura as estações escondidas</p>
<div class="radio">
  <div class="grill"><b>CAROLINA · 38</b></div>
  <div class="lcd"><span id="freq">87.0 MHz</span><small id="stn">sem sinal</small></div>
  <div class="dial" id="dial"><div class="scale" id="scale"></div><div class="needle"></div></div>
  <div class="knobs"><button class="knob" id="power" type="button">LIGAR</button><div class="found" id="found"></div><button class="knob" id="vol" type="button">SOM</button></div>
</div>
<div class="msg" id="msg"><b>Como funciona</b><p>Liga o rádio. Há cinco estações escondidas entre os 87 e os 108. A última está trancada e só sintoniza com o código que vem no cartão.</p></div>
<div class="code" id="codeRow" hidden><input id="code" inputmode="numeric" maxlength="4" placeholder="CÓDIGO" aria-label="Código do cartão"><button id="codeBtn" type="button">Sintonizar</button></div>
<script>
const $=id=>document.getElementById(id);
// Estações: frequência, nome e o que se ouve (voz e melodia sintetizadas)
const ST=[
 {f:90.4,n:'Rádio Batizado',t:'Bom dia, madrinha. Esta estação transmite desde 2010 e o primeiro programa foi um bebé a chorar durante uma hora. Obrigado por teres ficado até ao fim.',m:[60,64,67,72]},
 {f:94.8,n:'Antena Domingo',t:'Notícia de última hora: o afilhado voltou a pedir para ficar mais um bocadinho em casa da madrinha. Fontes próximas confirmam que é sempre assim.',m:[62,65,69,74]},
 {f:98.2,n:'Rádio Presente',t:'Passamos agora os maiores êxitos da madrinha: presentes nos anos, presentes no Natal e presentes sem motivo nenhum. Nenhum falhou.',m:[64,67,71,76]},
 {f:102.6,n:'Rádio Gargalhada',t:'Previsão do tempo para hoje: céu limpo, temperatura agradável e probabilidade de cem por cento de alguém contar uma história embaraçosa do afilhado ao almoço.',m:[65,69,72,77]},
 {f:106.6,n:'Frequência 22/11',t:'Esta é a estação mais importante. Madrinha, nem sempre digo isto, por isso digo pela rádio: gosto muito de ti. Parabéns. O teu afilhado, Tiago.',m:[60,64,67,72,76,79],lock:'2211'}
];
const MIN=87,MAX=108,PX=40; // 40 px por MHz
const scale=$('scale');for(let f=MIN-2;f<=MAX+2;f++){const s=document.createElement('span');s.textContent=f;if(ST.some(x=>Math.floor(x.f)===f))s.classList.add('st');scale.appendChild(s)}
ST.forEach(()=>{$('found').appendChild(document.createElement('i'))});
let freq=87,on=false,ac,noiseG,toneG,cur=null,heard=new Set(),unlocked=false;
function place(){const w=$('dial').clientWidth;scale.style.transform=`translateX(${w/2-((freq-(MIN-2))*PX+PX/2)}px)`;$('freq').textContent=freq.toFixed(1)+' MHz'}
let drag=null;
$('dial').addEventListener('pointerdown',e=>{drag={x:e.clientX,f:freq};$('dial').setPointerCapture(e.pointerId)});
$('dial').addEventListener('pointermove',e=>{if(!drag)return;freq=Math.max(MIN,Math.min(MAX,drag.f-(e.clientX-drag.x)/PX));place();tune()});
$('dial').addEventListener('pointerup',()=>drag=null);
function audio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();
  const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let k=0;k<n;k++)d[k]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=b;src.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.6;
  noiseG=ac.createGain();noiseG.gain.value=0;src.connect(f).connect(noiseG).connect(ac.destination);src.start()}
$('power').onclick=()=>{audio();on=!on;$('power').textContent=on?'DESLIGAR':'LIGAR';if(!on){noiseG.gain.value=0;speechSynthesis.cancel();cur=null;$('stn').textContent='desligado'}else tune()};
function tune(){
  if(!on)return;const s=ST.find(x=>Math.abs(x.f-freq)<.35),dist=s?Math.abs(s.f-freq):1;
  noiseG.gain.setTargetAtTime(s?Math.min(.18,dist*.5):.18,ac.currentTime,.05);$('dial').classList.toggle('on',!!s&&dist<.15);
  if(s&&dist<.15&&cur!==s){
    if(s.lock&&!unlocked){cur=null;$('stn').textContent='trancada';$('msg').innerHTML='<b>Estação trancada</b><p>Esta frequência precisa do código do cartão. Dica para o protótipo: é o dia e o mês dos anos dela.</p>';$('codeRow').hidden=false;return}
    cur=s;play(s)}
  else if(!s||dist>=.15){if(cur){cur=null;speechSynthesis.cancel()}$('stn').textContent='sem sinal'}
}
function play(s){
  $('stn').textContent=s.n;$('msg').innerHTML=`<b>${s.f.toFixed(1)} · ${s.n}</b><p>${s.t}</p>`;
  heard.add(s.f);[...$('found').children].forEach((d,k)=>d.classList.toggle('on',heard.has(ST[k].f)));
  s.m.forEach((n,k)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+k*.16;o.type='triangle';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.55)});
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.t);u.lang='pt-PT';const v=speechSynthesis.getVoices().find(x=>/pt[-_]PT/i.test(x.lang));if(v)u.voice=v;setTimeout(()=>speechSynthesis.speak(u),900)}catch(e){}
}
$('codeBtn').onclick=()=>{if($('code').value==='2211'){unlocked=true;$('codeRow').hidden=true;cur=null;tune()}else{$('code').value='';$('code').placeholder='ERRADO'}};
$('vol').onclick=()=>{if(noiseG)noiseG.gain.value=0};
addEventListener('resize',place);place();
</script></body></html>
